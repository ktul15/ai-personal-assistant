name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

jobs:
  backend:
    name: Backend (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

  flutter:
    name: Flutter (mobile)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Read Flutter version directly from FVM config — avoids relying on
      # the kuhnroyal action's output interface, which changed between v1/v2.
      - name: Read Flutter version from FVM config
        id: fvm
        run: echo "version=$(jq -r '.flutterSdkVersion' mobile/.fvm/fvm_config.json)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      # bare `flutter` is intentional in CI — subosito/flutter-action manages
      # the SDK version; FVM is a local-dev tool only.
      - name: Analyze
        working-directory: mobile
        run: flutter analyze --fatal-infos

      - name: Test
        working-directory: mobile
        run: flutter test --coverage
